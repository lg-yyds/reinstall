name: reinstall
on:
  schedule:
    - cron: '55 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # 清理运行记录需要

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone reinstall
        run: git clone https://github.com/bin456789/reinstall.git

      - name: Copy files
        run: cp -r reinstall/* .

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          # 只有真正有改动时才提交
          if ! git diff --staged --quiet; then
            git commit -m "reinstall"
            git push origin main
          else
            echo "没有文件变更，跳过提交"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 新增：清理旧的工作流运行记录 ==========
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
